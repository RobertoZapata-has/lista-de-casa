<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1F4A40">
<title>Lista de casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // ====== PASO 1: pegá acá la URL de tu Apps Script (termina en /exec) ======
  const API_URL = "https://script.google.com/macros/s/AKfycbxkvlBPbNnePslgQalMY8nSsxqWp-om69pUa20vCikrGA7LRvD0VAb5jfAHKKgX4iE/exec";
</script>
<style>
  :root{
    --paper:#F3EFE4; --paper-2:#EAE3D2; --ink:#22221E; --ink-soft:#6E6858; --ink-faint:#A39C89;
    --teal:#2F6B5E; --teal-deep:#1F4A40; --ochre:#C98A2C; --ochre-deep:#9C6A1B;
    --line:#DCD3BE; --danger:#A8543A; --radius:14px;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; overscroll-behavior-y:none; display:flex; flex-direction:column; min-height:100vh;}
  .display{font-family:'Space Grotesk',sans-serif;}

  #configWarning{background:var(--danger); color:#fff; font-size:13px; font-weight:600; padding:10px 16px; text-align:center; display:none;}

  header{padding: calc(16px + var(--safe-t)) 18px 14px; background:var(--teal-deep); color:#F3EFE4; display:flex; align-items:center; justify-content:space-between; flex-shrink:0;}
  header h1{font-size:19px; margin:0; font-weight:700; letter-spacing:-0.01em;}
  header .sub{font-size:12.5px; color:#B9CFC8; margin-top:2px; font-weight:500;}
  .who-pill{display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.16); color:#F3EFE4; padding:7px 12px 7px 8px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;}
  .who-pill .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .who-pill:active{opacity:0.75;}

  main{flex:1; padding:16px 16px calc(190px + var(--safe-b)); max-width:560px; width:100%; margin:0 auto;}

  .section-label{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); margin:22px 2px 8px; display:flex; align-items:center; justify-content:space-between;}
  .section-label:first-child{margin-top:4px;}
  .text-btn{background:none; border:none; color:var(--ink-soft); font-size:12px; font-weight:600; text-decoration:underline; text-underline-offset:2px; padding:4px; cursor:pointer; text-transform:none; letter-spacing:0;}

  .cat-heading{font-size:12.5px; font-weight:600; color:var(--ink-soft); margin:14px 2px 6px; display:flex; align-items:center; gap:6px;}
  .cat-block:first-child .cat-heading{margin-top:0;}

  ul{list-style:none; margin:0; padding:0;}

  .item{display:flex; align-items:center; gap:0; background:#fff; border-radius:var(--radius); margin-bottom:8px; overflow:hidden; box-shadow:0 1px 2px rgba(34,34,30,0.06); transition: max-height .35s ease, opacity .35s ease, margin .35s ease; max-height:80px;}
  .item.leaving{max-height:0; opacity:0; margin-bottom:0; pointer-events:none;}
  .tab{width:5px; align-self:stretch; flex-shrink:0;}
  .item-body{flex:1; display:flex; align-items:center; gap:12px; padding:13px 10px 13px 12px; min-width:0;}
  .check{width:23px;height:23px; border-radius:50%; border:2px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; transition: border-color .15s, background .15s;}
  .check svg{width:13px;height:13px; opacity:0; transition:opacity .15s;}
  .item.done .check{background:var(--teal); border-color:var(--teal);}
  .item.done .check svg{opacity:1;}
  .item-text{flex:1; min-width:0;}
  .item-name{font-size:15.5px; font-weight:500; color:var(--ink); word-break:break-word;}
  .item-name .qty{font-weight:400; color:var(--ink-faint); font-size:14px;}
  .item.done .item-name{color:var(--ink-faint); text-decoration:line-through; text-decoration-color:var(--ink-faint);}
  .item-meta{font-size:11.5px; color:var(--ink-faint); margin-top:1px; font-weight:500;}
  .item-meta.stale{color:var(--ochre-deep); font-weight:700;}
  .del-btn{background:none; border:none; color:var(--ink-faint); font-size:20px; line-height:1; padding:10px 12px; cursor:pointer; flex-shrink:0;}
  .del-btn:active{color:var(--danger);}

  .empty{text-align:center; padding:50px 20px 20px; color:var(--ink-faint);}
  .empty svg{width:48px;height:48px; margin-bottom:14px; opacity:0.55;}
  .empty p{font-size:14.5px; line-height:1.5; margin:0; max-width:260px; margin:0 auto;}

  .toast{position:fixed; left:50%; bottom:calc(166px + var(--safe-b)); transform:translateX(-50%) translateY(10px); background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:500; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:50; white-space:nowrap; max-width:88vw; text-overflow:ellipsis; overflow:hidden;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .composer{position:fixed; left:0; right:0; bottom:0; padding: 8px 14px calc(14px + var(--safe-b)); background:linear-gradient(to top, var(--paper) 65%, rgba(243,239,228,0));}
  .composer-extra{max-width:560px; margin:0 auto 6px; display:flex; gap:6px; overflow-x:auto; -ms-overflow-style:none; scrollbar-width:none;}
  .composer-extra::-webkit-scrollbar{display:none;}
  .qty-input{flex-shrink:0; width:64px; border:1px solid var(--line); border-radius:999px; padding:7px 10px; font-size:13px; font-family:inherit; color:var(--ink); background:#fff; outline:none;}
  .qty-input::placeholder{color:var(--ink-faint);}
  .cat-chip{flex-shrink:0; border:1px solid var(--line); background:#fff; color:var(--ink-soft); border-radius:999px; padding:7px 12px; font-size:12.5px; font-weight:600; white-space:nowrap; cursor:pointer;}
  .cat-chip.active{background:var(--ochre); border-color:var(--ochre); color:#fff;}

  .composer-inner{max-width:560px; margin:0 auto; display:flex; align-items:center; gap:6px; background:#fff; border-radius:999px; padding:6px 6px 6px 6px; box-shadow:0 4px 18px rgba(34,34,30,0.14), 0 1px 2px rgba(34,34,30,0.08); border:1px solid var(--line);}
  .mic-btn{width:38px;height:38px; border-radius:50%; background:var(--paper-2); border:none; color:var(--ink-soft); flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .mic-btn svg{width:17px;height:17px;}
  .mic-btn.listening{background:var(--ochre); color:#fff; animation:pulse 1.1s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,138,44,0.45);} 70%{box-shadow:0 0 0 10px rgba(201,138,44,0);} 100%{box-shadow:0 0 0 0 rgba(201,138,44,0);}}
  .composer-inner input{flex:1; border:none; outline:none; font-size:16px; font-family:inherit; color:var(--ink); background:transparent; padding:8px 0; min-width:0;}
  .composer-inner input::placeholder{color:var(--ink-faint);}
  .add-btn{width:40px;height:40px; border-radius:50%; background:var(--ochre); border:none; color:#fff; font-size:22px; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; transition: transform .1s, background .15s;}
  .add-btn:active{transform:scale(0.92); background:var(--ochre-deep);}
  .add-btn:disabled{background:var(--line); color:var(--ink-faint);}

  .overlay{position:fixed; inset:0; background:var(--teal-deep); color:#F3EFE4; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; z-index:100; text-align:center;}
  .overlay h2{font-size:23px; margin:0 0 6px; font-weight:700;}
  .overlay p{font-size:14px; color:#B9CFC8; margin:0 0 32px; max-width:260px; line-height:1.5;}
  .who-options{display:flex; gap:12px;}
  .who-btn{width:120px; padding:22px 10px; border-radius:16px; border:1.5px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.06); color:#fff; font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; cursor:pointer;}
  .who-btn:active{background:rgba(255,255,255,0.14);}
  .who-btn .avatar{width:36px;height:36px; border-radius:50%; margin:0 auto 10px;}

  .hidden{display:none !important;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
</style>
</head>
<body>

<div id="configWarning">⚠️ Falta configurar API_URL en el HTML (arriba del todo).</div>

<div id="overlay" class="overlay hidden">
  <h2 class="display">¿Quién sos?</h2>
  <p>Así sabemos quién anotó cada cosa. Después podés cambiarlo tocando tu nombre arriba.</p>
  <div class="who-options">
    <button class="who-btn" data-name="Rober"><span class="avatar" style="background:var(--teal)"></span>Rober</button>
    <button class="who-btn" data-name="Jesi"><span class="avatar" style="background:var(--ochre)"></span>Jesi</button>
  </div>
</div>

<header>
  <div>
    <h1 class="display">Lista de casa</h1>
    <div class="sub" id="countSub">cargando…</div>
  </div>
  <button class="who-pill" id="whoPill">
    <span class="dot" id="whoDot"></span>
    <span id="whoLabel">…</span>
  </button>
</header>

<main>
  <div id="pendingSection">
    <div class="section-label">
      <span>Falta</span>
      <button class="text-btn" id="shareBtn">Compartir</button>
    </div>
    <div id="pendingList"></div>
  </div>

  <div id="emptyState" class="empty hidden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2v4M18 2v4M4 8h16l-1.5 12.5A2 2 0 0116.5 22h-9a2 2 0 01-2-1.5L4 8z"/></svg>
    <p>No falta nada por ahora. Cuando se te ocurra algo, escribilo abajo.</p>
  </div>

  <div id="doneSection" class="hidden">
    <div class="section-label">
      <span id="doneLabel">Comprado</span>
      <button class="text-btn" id="clearDoneBtn">Vaciar</button>
    </div>
    <ul id="doneList"></ul>
  </div>
</main>

<div class="composer">
  <div class="composer-extra">
    <input id="qtyInput" class="qty-input" placeholder="cant." maxlength="14" autocomplete="off">
    <button class="cat-chip" data-cat="limpieza">🧽 Limpieza</button>
    <button class="cat-chip" data-cat="cocina">🍳 Cocina</button>
    <button class="cat-chip" data-cat="bano">🧻 Baño</button>
    <button class="cat-chip active" data-cat="otros">📦 Otros</button>
  </div>
  <div class="composer-inner">
    <button class="mic-btn" id="micBtn" aria-label="Dictar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="8" y1="21" x2="16" y2="21"/></svg>
    </button>
    <input id="itemInput" type="text" placeholder="¿Qué falta?" maxlength="80" autocomplete="off">
    <button class="add-btn" id="addBtn">+</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  if(!API_URL || API_URL.indexOf('PEGA_ACA') === 0){
    document.getElementById('configWarning').style.display = 'block';
  }

  const PERSON_COLORS = { Rober: 'var(--teal)', Jesi: 'var(--ochre)' };
  const CATEGORIES = [
    { key:'limpieza', label:'Limpieza', emoji:'🧽' },
    { key:'cocina', label:'Cocina', emoji:'🍳' },
    { key:'bano', label:'Baño', emoji:'🧻' },
    { key:'otros', label:'Otros', emoji:'📦' }
  ];
  const STALE_DAYS = 4;

  let myName = localStorage.getItem('lista-casa-quien');
  let selectedCat = localStorage.getItem('lista-casa-cat') || 'otros';
  let items = [];

  const el = id => document.getElementById(id);
  const overlay = el('overlay');
  const whoPill = el('whoPill');
  const whoDot = el('whoDot');
  const whoLabel = el('whoLabel');
  const pendingList = el('pendingList');
  const doneList = el('doneList');
  const pendingSection = el('pendingSection');
  const doneSection = el('doneSection');
  const emptyState = el('emptyState');
  const doneLabel = el('doneLabel');
  const countSub = el('countSub');
  const itemInput = el('itemInput');
  const qtyInput = el('qtyInput');
  const addBtn = el('addBtn');
  const micBtn = el('micBtn');
  const shareBtn = el('shareBtn');
  const toastEl = el('toast');

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=> toastEl.classList.remove('show'), 2400);
  }

  function relTime(iso){
    const diffMs = Date.now() - new Date(iso).getTime();
    const min = Math.round(diffMs/60000);
    if(min < 1) return 'recién';
    if(min < 60) return 'hace ' + min + ' min';
    const hs = Math.round(min/60);
    if(hs < 24) return 'hace ' + hs + (hs===1?' hora':' horas');
    const days = Math.round(hs/24);
    return 'hace ' + days + (days===1?' día':' días');
  }

  function daysSince(iso){
    return (Date.now() - new Date(iso).getTime()) / 86400000;
  }

  function setWho(name){
    myName = name;
    whoLabel.textContent = name;
    whoDot.style.background = PERSON_COLORS[name] || '#fff';
  }

  function pickName(name){
    setWho(name);
    localStorage.setItem('lista-casa-quien', name);
    overlay.classList.add('hidden');
  }

  whoPill.addEventListener('click', ()=> overlay.classList.remove('hidden'));
  document.querySelectorAll('.who-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> pickName(btn.dataset.name));
  });

  document.querySelectorAll('.cat-chip').forEach(chip=>{
    if(chip.dataset.cat === selectedCat) chip.classList.add('active');
    else chip.classList.remove('active');
    chip.addEventListener('click', ()=>{
      selectedCat = chip.dataset.cat;
      localStorage.setItem('lista-casa-cat', selectedCat);
      document.querySelectorAll('.cat-chip').forEach(c=> c.classList.toggle('active', c===chip));
    });
  });

  async function fetchItems(){
    try{
      const res = await fetch(API_URL, { method:'GET' });
      const data = await res.json();
      return data.items || [];
    }catch(e){
      showToast('No se pudo conectar. Revisá tu internet.');
      return items;
    }
  }

  async function callApi(payload){
    try{
      const res = await fetch(API_URL, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if(data.ok === false){ showToast('Error al guardar.'); }
      return data;
    }catch(e){
      showToast('No se pudo guardar. Probá de nuevo.');
      return null;
    }
  }

  function render(){
    const pending = items.filter(i=>!i.done);
    const done = items.filter(i=>i.done).sort((a,b)=> new Date(b.doneAt)-new Date(a.doneAt));

    countSub.textContent = pending.length === 0 ? 'no falta nada' : (pending.length + (pending.length===1 ? ' cosa falta' : ' cosas faltan'));

    pendingSection.classList.toggle('hidden', pending.length===0);
    emptyState.classList.toggle('hidden', pending.length!==0);
    doneSection.classList.toggle('hidden', done.length===0);
    doneLabel.textContent = 'Comprado' + (done.length ? ' (' + done.length + ')' : '');

    pendingList.innerHTML = CATEGORIES.map(cat=>{
      const catItems = pending.filter(i => (i.category || 'otros') === cat.key)
        .sort((a,b)=> new Date(b.addedAt)-new Date(a.addedAt));
      if(!catItems.length) return '';
      return '<div class="cat-block">' +
        '<div class="cat-heading">' + cat.emoji + ' ' + cat.label + '</div>' +
        '<ul>' + catItems.map(rowHtml).join('') + '</ul>' +
      '</div>';
    }).join('');

    doneList.innerHTML = done.map(rowHtml).join('');

    pendingList.querySelectorAll('.item').forEach(bindRow);
    doneList.querySelectorAll('.item').forEach(bindRow);
  }

  function rowHtml(it){
    const color = PERSON_COLORS[it.addedBy] || 'var(--ink-faint)';
    const isStale = !it.done && daysSince(it.addedAt) >= STALE_DAYS;
    const meta = it.done
      ? (it.doneBy || it.addedBy) + ' lo compró ' + relTime(it.doneAt)
      : (isStale ? '⏰ ' : '') + (it.addedBy || '—') + ' · ' + relTime(it.addedAt);
    const qtyHtml = it.qty ? ' <span class="qty">(' + escapeHtml(it.qty) + ')</span>' : '';
    return '<li class="item' + (it.done?' done':'') + '" data-id="' + it.id + '">' +
      '<div class="tab" style="background:' + color + '"></div>' +
      '<div class="item-body">' +
        '<div class="check">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' +
        '</div>' +
        '<div class="item-text">' +
          '<div class="item-name">' + escapeHtml(it.name) + qtyHtml + '</div>' +
          '<div class="item-meta' + (isStale?' stale':'') + '">' + escapeHtml(meta) + '</div>' +
        '</div>' +
      '</div>' +
      '<button class="del-btn" aria-label="Borrar">×</button>' +
    '</li>';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function bindRow(rowEl){
    const id = rowEl.dataset.id;
    rowEl.querySelector('.check').addEventListener('click', ()=> toggleDone(id));
    rowEl.querySelector('.del-btn').addEventListener('click', ()=> deleteItem(id, rowEl));
  }

  async function toggleDone(id){
    items = items.map(it => {
      if(it.id !== id) return it;
      const done = !it.done;
      return Object.assign({}, it, { done, doneBy: done ? myName : null, doneAt: done ? new Date().toISOString() : null });
    });
    render();
    const data = await callApi({ action:'toggle', id, by: myName });
    if(data && data.items){ items = data.items; render(); }
  }

  function deleteItem(id, rowEl){
    if(rowEl) rowEl.classList.add('leaving');
    setTimeout(async ()=>{
      items = items.filter(it => it.id !== id);
      render();
      const data = await callApi({ action:'delete', id });
      if(data && data.items){ items = data.items; render(); }
    }, 220);
  }

  el('clearDoneBtn').addEventListener('click', async ()=>{
    items = items.filter(it => !it.done);
    render();
    const data = await callApi({ action:'clearDone' });
    if(data && data.items){ items = data.items; render(); }
  });

  async function addItem(){
    const text = itemInput.value.trim();
    if(!text) return;
    const qty = qtyInput.value.trim();
    itemInput.value = '';
    qtyInput.value = '';
    addBtn.disabled = true;
    const data = await callApi({ action:'add', name: text, qty, category: selectedCat, by: myName });
    if(data && data.items){ items = data.items; render(); }
    addBtn.disabled = false;
    itemInput.focus();
  }

  addBtn.addEventListener('click', addItem);
  itemInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') addItem(); });

  // --- Dictado por voz ---
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  if(SpeechRecognitionCtor){
    recognition = new SpeechRecognitionCtor();
    recognition.lang = 'es-AR';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.addEventListener('result', e=>{
      const text = e.results[0][0].transcript;
      itemInput.value = text.charAt(0).toUpperCase() + text.slice(1);
      itemInput.focus();
    });
    recognition.addEventListener('end', ()=> micBtn.classList.remove('listening'));
    recognition.addEventListener('error', ()=>{
      micBtn.classList.remove('listening');
      showToast('No se entendió, probá de nuevo');
    });
  }
  micBtn.addEventListener('click', ()=>{
    if(!recognition){ showToast('Tu navegador no soporta dictado por voz'); return; }
    micBtn.classList.add('listening');
    try{ recognition.start(); }catch(e){ /* ya estaba escuchando */ }
  });

  // --- Compartir por WhatsApp ---
  function buildShareText(){
    const pending = items.filter(i=>!i.done);
    const lines = ['🛒 *Lista de casa*', ''];
    CATEGORIES.forEach(cat=>{
      const catItems = pending.filter(i => (i.category||'otros') === cat.key);
      if(!catItems.length) return;
      lines.push(cat.emoji + ' ' + cat.label);
      catItems.forEach(it=> lines.push('• ' + it.name + (it.qty ? ' (' + it.qty + ')' : '')));
      lines.push('');
    });
    return lines.join('\n').trim();
  }

  shareBtn.addEventListener('click', async ()=>{
    const pending = items.filter(i=>!i.done);
    if(!pending.length){ showToast('No hay nada para compartir'); return; }
    const text = buildShareText();
    if(navigator.share){
      try{ await navigator.share({ text, title:'Lista de casa' }); }catch(e){ /* cancelado, ignorar */ }
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }
  });

  async function refresh(){
    items = await fetchItems();
    render();
  }

  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') refresh();
  });

  async function init(){
    if(myName){ setWho(myName); } else { overlay.classList.remove('hidden'); whoLabel.textContent = 'elegir'; }
    await refresh();
    setInterval(refresh, 5000);
  }

  init();
})();
</script>
</body>
</html>
